</div>

<section style="max-width: 1080px; margin: 0 auto; padding: 56px 24px 28px">
<p style="margin: 0 0 12px; font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; color: {{c.accent}}">Case study · a feature I'm proposing for SuperKalam, with a working prototype built on its own Polity lesson</p>
<h1 class="mp-h1" style="margin: 0 0 18px; max-width: 860px; font-size: 52px; line-height: 1.08; font-weight: 700; letter-spacing: -0.015em">“My Pages”: a feature that makes the first read of a UPSC lesson stick</h1>
<p style="margin: 0; max-width: 740px; font-size: 21px; line-height: 1.6; color: {{c.body}}"><b style="color: {{c.ink}}">My Pages</b> is a feature for SuperKalam's lessons that turns each lesson into the student's own marked-up copy. Every answer they give leaves a mark on the lesson they just read. Over a few weeks, they own an annotated copy of the syllabus that exists nowhere else, and their mistakes wait for them on the exact lines they came from.</p>
<p style="margin: 16px 0 0; max-width: 740px; font-family: 'Lato', sans-serif; font-size: 15px; line-height: 1.5; color: {{c.muted}}">In this case study, “My Pages” always means the feature, not this page.</p>
</section>


<div style="max-width: 1080px; margin: 0 auto; padding: 0 24px">

<section style="padding: 48px 0 8px; border-top: 1px solid {{c.line}}; margin-top: 40px; display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 220px; max-width: 260px"><h2 style="margin: 0; font-family: 'Lato', sans-serif; font-size: 22px; font-weight: 700">What I noticed</h2></div>
<div style="flex: 999 1 520px; min-width: 0; max-width: 720px; font-size: 19px; line-height: 1.65">
<p style="margin: 0 0 16px">I went through Polity, Unit 1, Lesson 1, <i>The Company Rule</i>, the way a new aspirant would. The content is clear and well structured. The learning loop around it is a test, not a learning experience:</p>
<ul style="margin: 0 0 16px; padding-left: 22px; display: flex; flex-direction: column; gap: 8px">
<li>About ten minutes of reading with nothing to do, then 5 MCQs on a separate screen.</li>
<li>The scorecard says <b>3/5</b>, and nothing else. It doesn't say which two were wrong, why, or where to look. That knowledge is gone the moment you tap Continue.</li>
<li>The questions never touch <b>3 of the 7 acts</b> (1784, 1786 and 1793).</li>
<li>The UPSC question from 2019 sits at the bottom of the article, far from the line that answers it.</li>
</ul>
<p style="margin: 0">This matches what aspirants and mentors say everywhere: students read, feel they've understood, and forget within days. Everyone knows the fix is active recall. Almost nobody does it, because doing it alone is effortful and unstructured.</p>
</div>
</section>

<section style="padding: 48px 0 8px; display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 220px; max-width: 260px"><h2 style="margin: 0; font-family: 'Lato', sans-serif; font-size: 22px; font-weight: 700">The idea</h2></div>
<div style="flex: 999 1 520px; min-width: 0; max-width: 720px">
<p style="margin: 0 0 22px; font-size: 19px; line-height: 1.65">Learning isn't a floor you jump onto from reading to MCQs. It's a ladder. The My Pages feature adds the missing rungs inside each lesson, and makes every step leave a trace:</p>
<div class="mp-grid3" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; font-family: 'Lato', sans-serif">
<div style="border: 1px solid {{c.line}}; border-radius: 10px; padding: 16px"><div style="font-family: 'Source Serif 4', serif; font-size: 22px; font-weight: 700; margin-bottom: 6px">Read</div><div style="font-size: 15px; line-height: 1.5; color: {{c.body}}">A calm, book-like page with a picture every screen. Tap a dotted word to understand it; select words to highlight them; write your own notes.</div></div>
<div style="border: 1px solid {{c.line}}; border-radius: 10px; padding: 16px"><div style="font-family: 'Source Serif 4', serif; font-size: 22px; font-weight: 700; margin-bottom: 6px">Practise</div><div style="font-size: 15px; line-height: 1.5; color: {{c.body}}">A 7-task worksheet, not a quiz: order events, fill gaps, label a diagram, draw links, circle, correct, and say it out loud.</div></div>
<div style="border: 1px solid {{c.line}}; border-radius: 10px; padding: 16px"><div style="font-family: 'Source Serif 4', serif; font-size: 22px; font-weight: 700; margin-bottom: 6px">Revise</div><div style="font-size: 15px; line-height: 1.5; color: {{c.body}}">Mistakes become sticky notes on the exact lines. A short revision sheet asks only what you slipped on, and fixed notes are struck through, never deleted.</div></div>
</div>
</div>
</section>

<section style="padding: 56px 0 8px">
<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
<div style="flex: 1 1 360px; min-width: 0; max-width: 560px">
<h2 style="margin: 0 0 10px; font-family: 'Lato', sans-serif; font-size: 22px; font-weight: 700">Try it in five minutes</h2>
<p style="margin: 0 0 22px; font-size: 18px; line-height: 1.6; color: {{c.body}}">The phone beside this is the live prototype. Follow these steps in order. Getting a couple of answers wrong on purpose is the best way to see the idea.</p>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px">
<li style="display: grid; grid-template-columns: 34px 1fr; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 14px; border: 1.5px solid {{c.accent}}; color: {{c.accent}}; font-family: 'Lato', sans-serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">1</span><span style="font-size: 17px; line-height: 1.55"><b>Scroll and read.</b> Start with the big picture, then the first act, 1773. Notice the portraits and the drawn diagrams.</span></li>
<li style="display: grid; grid-template-columns: 34px 1fr; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 14px; border: 1.5px solid {{c.accent}}; color: {{c.accent}}; font-family: 'Lato', sans-serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">2</span><span style="font-size: 17px; line-height: 1.55"><b>Tap a dotted word</b>, like <i>Governor-General of Bengal</i>, to see it explained.</span></li>
<li style="display: grid; grid-template-columns: 34px 1fr; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 14px; border: 1.5px solid {{c.accent}}; color: {{c.accent}}; font-family: 'Lato', sans-serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">3</span><span style="font-size: 17px; line-height: 1.55"><b>Select a few words</b> and press Highlight. Or tap a point's number to write your own note.</span></li>
<li style="display: grid; grid-template-columns: 34px 1fr; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 14px; border: 1.5px solid {{c.accent}}; color: {{c.accent}}; font-family: 'Lato', sans-serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">4</span><span style="font-size: 17px; line-height: 1.55"><b>Scroll to the end and tap Start practice.</b> Do the worksheet, and get two or three answers wrong on purpose.</span></li>
<li style="display: grid; grid-template-columns: 34px 1fr; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 14px; border: 1.5px solid {{c.accent}}; color: {{c.accent}}; font-family: 'Lato', sans-serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">5</span><span style="font-size: 17px; line-height: 1.55"><b>Check, then Put it on my pages.</b> Scroll up: your mistakes are now pink sticky notes on the exact lines, stating the fact you missed.</span></li>
<li style="display: grid; grid-template-columns: 34px 1fr; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 14px; border: 1.5px solid {{c.accent}}; color: {{c.accent}}; font-family: 'Lato', sans-serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">6</span><span style="font-size: 17px; line-height: 1.55"><b>Tap Revise my sticky notes.</b> Get one right and one wrong: watch one note turn "Fixed" and the other "Missed twice".</span></li>
<li style="display: grid; grid-template-columns: 34px 1fr; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 14px; border: 1.5px solid {{c.accent}}; color: {{c.accent}}; font-family: 'Lato', sans-serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">7</span><span style="font-size: 17px; line-height: 1.55"><b>Tap ✕ partway through a lesson</b> to see the streak reminder. It appears once per session, only mid-lesson.</span></li>
</ol>
<p style="margin: 22px 0 0; font-family: 'Lato', sans-serif; font-size: 15px; color: {{c.muted}}">Prefer a bigger screen? <a href="desktop.html" style="font-weight: 700; color: {{c.accent}}">Open the desktop version</a>, where your notes and explanations sit in the margin.</p>
</div>

<div style="width: 390px; height: 844px; border-radius: 26px; overflow: hidden; background: #FFFFFF">
<dc-import name="Phone" tour="off" hint-size="390px,844px"></dc-import>

<section style="padding: 64px 0 8px; display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 220px; max-width: 260px"><h2 style="margin: 0; font-family: 'Lato', sans-serif; font-size: 22px; font-weight: 700">Decisions I made, and why</h2></div>
<div style="flex: 999 1 520px; min-width: 0; max-width: 720px; display: flex; flex-direction: column; gap: 22px; font-size: 18px; line-height: 1.6">
<div><b>A worksheet, not a quiz.</b> Clicking an option tests recognition. Ordering events, labelling a diagram, drawing a cause to its act and saying an explanation out loud each use a different sense, and each makes the student produce something. The first version of task 1 asked students to order years; I replaced it because sorting numbers tests nothing.</div>
<div><b>Marks are earned, never handed out.</b> The page starts clean. If the AI pre-highlights everything, nothing stands out and the copy stops feeling like the student's own.</div>
<div><b>Mistakes say what to remember, not what you did.</b> A sticky note reads "First Governor-General of Bengal: Warren Hastings, 1773. Of Bengal, not yet of India", never "You left this blank". One note per concept, on the line it belongs to.</div>
<div><b>Notes are never deleted.</b> Wiping old mistakes destroys the revision list; freezing them turns the page into noise. Fixed notes fade and are struck through; repeated ones turn red and say "Missed twice". The revision sheet asks the same fact in a new form, so students can't just remember the last answer.</div>
<div><b>A reading mode inside SuperKalam's look.</b> The interface uses SuperKalam's Lato and terracotta. The reading text uses a serif, because ten minutes of reading on a phone needs different type than a dashboard. I built a fully on-brand version too, and chose this one.</div>
<div><b>Real images, not AI art.</b> Public-domain portraits and engravings, plus simple drawn diagrams. For an exam where accuracy is everything, generated illustrations signal the wrong thing.</div>
<div><b>The streak reminder appears once, and only mid-lesson.</b> Shown on every exit, a growth nudge starts to feel like nagging.</div>
</div>
</section>

<section style="padding: 56px 0 8px; display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 220px; max-width: 260px"><h2 style="margin: 0; font-family: 'Lato', sans-serif; font-size: 22px; font-weight: 700">How I'd know it works</h2></div>
<div style="flex: 999 1 520px; min-width: 0; max-width: 720px">
<p style="margin: 0 0 16px; font-size: 18px; line-height: 1.6"><b>Hypothesis:</b> students who practise on their pages recall more a few days later, do better on that topic's MCQs and mains answers, and come back to their own pages to revise.</p>
<div style="overflow-x: auto; margin-bottom: 18px">
<table class="mp-table" style="width: 100%; border-collapse: collapse; font-family: 'Lato', sans-serif; font-size: 15px; line-height: 1.45">
<thead><tr><th style="text-align: left; padding: 8px 10px; border-bottom: 2px solid {{c.ink}}">Metric</th><th style="text-align: left; padding: 8px 10px; border-bottom: 2px solid {{c.ink}}">What it tells us</th></tr></thead>
<tbody>
<tr><td style="padding: 8px 10px; border-bottom: 1px solid {{c.line}}">Finished reading → started practice</td><td style="padding: 8px 10px; border-bottom: 1px solid {{c.line}}">Is the hand-off from reading compelling?</td></tr>
<tr><td style="padding: 8px 10px; border-bottom: 1px solid {{c.line}}">Worksheet completion, and where people drop</td><td style="padding: 8px 10px; border-bottom: 1px solid {{c.line}}">Is it short and engaging enough? Which task loses them?</td></tr>
<tr><td style="padding: 8px 10px; border-bottom: 1px solid {{c.line}}">Sticky notes fixed within 7 days</td><td style="padding: 8px 10px; border-bottom: 1px solid {{c.line}}">Are students closing their own gaps? The core learning outcome.</td></tr>
<tr><td style="padding: 8px 10px; border-bottom: 1px solid {{c.line}}">Revisits to their own pages before tests</td><td style="padding: 8px 10px; border-bottom: 1px solid {{c.line}}">Is the personal copy valuable? This is the moat.</td></tr>
<tr><td style="padding: 8px 10px; border-bottom: 1px solid {{c.line}}">Topic MCQ accuracy and mains score, with vs. without</td><td style="padding: 8px 10px; border-bottom: 1px solid {{c.line}}">Does it carry over to the exam?</td></tr>
</tbody>
</table>
</div>
<p style="margin: 0 0 12px; font-size: 17px; line-height: 1.6"><b>Events to track</b> (PostHog): <span style="font-family: 'Lato', sans-serif; font-size: 15px; color: {{c.body}}">term_tapped · words_highlighted · note_saved · practice_started · task_completed · worksheet_checked · sticky_created · sticky_fixed · sticky_missed_again · revise_started · page_revisited · exit_prompt_shown</span></p>
<p style="margin: 0; font-size: 17px; line-height: 1.6"><b>When I'd stop:</b> if worksheet completion stays low after two design rounds, if fixed-note rates show no lift over reading alone, or if students don't come back to their pages. Targets would be set before launch, not after.</p>
</div>
</section>

<section style="padding: 56px 0 8px; display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 220px; max-width: 260px"><h2 style="margin: 0; font-family: 'Lato', sans-serif; font-size: 22px; font-weight: 700">What I'd build next</h2></div>
<div style="flex: 999 1 520px; min-width: 0; max-width: 720px; font-size: 18px; line-height: 1.6">
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px">
<li><b>Wrong answers from SuperKalam's existing tests land as sticky notes</b> on the lesson they came from. It connects this to what's already built.</li>
<li><b>A content pipeline:</b> lesson text stored as sentences with IDs, worksheet templates filled by AI from the text and its PYQs, and every item reviewed and tied to the line it tests.</li>
<li><b>Spaced revision:</b> the revision sheet offered a day and a week later, not straight away.</li>
<li><b>Hinglish</b> for the large Hindi-belt audience.</li>
<li><b>A "Mains angle" rung:</b> spotting what's weak in a short answer, building an answer skeleton, as the bridge from facts to writing.</li>
</ol>
</div>
</section>

<section style="padding: 56px 0 8px; display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 220px; max-width: 260px"><h2 style="margin: 0; font-family: 'Lato', sans-serif; font-size: 22px; font-weight: 700">Honest limits</h2></div>
<div style="flex: 999 1 520px; min-width: 0; max-width: 720px; font-size: 17px; line-height: 1.6; color: {{c.body}}">
<p style="margin: 0 0 10px">The prototype covers one lesson, hand-built as a demo of the feature. Highlights, notes and sticky notes reset when the page reloads, and all dates show today. The revision sheet uses one question format. I haven't tested it with aspirants yet; that's the first thing I'd do.</p>
<p style="margin: 0">Prototyped with AI coding tools, which is how I'd expect to work as a founding PM: build the thing, then argue about it.</p>
</div>
</section>

<section style="margin-top: 56px; padding: 22px 0 0; border-top: 1px solid {{c.line}}; font-family: 'Lato', sans-serif; font-size: 13px; line-height: 1.6; color: {{c.muted}}">
Lesson content adapted from SuperKalam's Polity, Unit 1, Lesson 1, for this private demo only. Images from Wikimedia Commons, all public domain: East India House after Thomas Shepherd; Warren Hastings by Tilly Kettle; William Pitt the Younger by George Romney; Lord Cornwallis by Thomas Gainsborough; The European Factories, Canton, by William Daniell; Lord William Bentinck by Thomas Lawrence; Thomas Babington Macaulay by John Partridge.
</section>

</div>
</div>
</template>

<p style="margin: 0 0 6px; font-size: 14px; font-style: italic; color: #6B675E">Polity, Unit 1 · Lesson 1</p>
<h1 style="margin: 0 0 18px; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em">The Company Rule</h1>

<figure style="margin: 0 -22px 18px">

<p style="margin: 0 0 16px; font-size: {{fsLead}}px; line-height: 1.6">In 1600 a group of London merchants got a royal charter to trade with the East. A century and a half later, that trading company was collecting taxes, running courts and fighting wars across eastern India.</p>
<p style="margin: 0 0 24px; font-size: {{fs}}px; line-height: 1.65">Back in London, Parliament began to ask an awkward question: who was the Company answerable to? The eight laws in this lesson are its answer, worked out a little at a time between 1773 and 1858.</p>

<p style="margin: 0 0 8px; font-size: 17px; line-height: 1.6">Before you move on, give it eight minutes. Eight short questions, and each answer marks your copy of these pages, so it's ready when you come back to revise.</p>

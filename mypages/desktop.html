<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Pages prototype (desktop)</title>
<meta name="description" content="My Pages: a feature proposal and working prototype for SuperKalam by Akash Chauhan. A UPSC lesson that becomes the student's own marked-up copy, where worksheet mistakes turn into sticky notes on the exact lines.">
<meta property="og:title" content="My Pages prototype (desktop)">
<meta property="og:description" content="My Pages: a feature proposal and working prototype for SuperKalam by Akash Chauhan. A UPSC lesson that becomes the student's own marked-up copy, where worksheet mistakes turn into sticky notes on the exact lines.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://a1akashchauhan.github.io/portfolio/mypages/desktop.html">
<meta property="og:image" content="https://a1akashchauhan.github.io/portfolio/mypages/assets/fbe48e8284e81fcd60ab99576223275b.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F6BDE'/%3E%3Cpath d='M9 8h11l3 3v13H9z' fill='%23fff'/%3E%3Crect x='12' y='14' width='8' height='5' fill='%23FBE38E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&amp;family=Lato:ital,wght@0,400;0,700;1,400&amp;family=Kalam:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6BDE}a:hover{color:#2456B8}
button{cursor:pointer}
</style>
<style>

html, body { margin: 0; height: 100%; }
#app > div { width: 100% !important; height: 100vh !important; height: 100dvh !important; }

</style>
<script src="assets/morphdom.min.js"></script>
<script src="assets/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl-Web">
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; box-sizing: border-box; background: #FFFFFF; color: #1C1B19; font-family: 'Source Serif 4', Georgia, serif; display: flex; flex-direction: column">

<header style="flex: none; background: #FFFFFF; border-bottom: 1px solid #E7E4DE; font-family: 'Lato', sans-serif">
<div style="max-width: 1040px; margin: 0 auto; padding: 8px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 6px">
<button aria-label="Back to the unit" onClick="{{openExit}}" style="width: 40px; height: 40px; border: 0; background: transparent; border-radius: 20px; padding: 0; display: flex; align-items: center; justify-content: center; color: #1C1B19"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg></button>
<div style="font-family: 'Source Serif 4', serif; font-size: 16px; font-style: italic; color: #4A4740; white-space: nowrap">Polity, Unit 1 · The Company Rule</div>
</div>
<nav aria-label="Jump to an act" style="display: flex; gap: 2px">
<sc-for list="{{nav}}" as="y" hint-placeholder-count="8">
<a href="#w-{{y.year}}" aria-label="{{y.label}}" style="height: 36px; padding: 0 9px; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: {{y.weight}}; color: {{y.color}}; border-bottom: 2px solid {{y.line}}">{{y.year}}</a>
</sc-for>
</nav>
<div style="display: flex; gap: 8px">
<button aria-pressed="{{big}}" onClick="{{toggleBig}}" style="height: 36px; padding: 0 12px; border: 1px solid #CFCBC2; background: {{aaBg}}; color: #1C1B19; font-family: 'Source Serif 4', serif; font-size: 15px; border-radius: 6px">Aa</button>
<button onClick="{{practise}}" style="height: 36px; padding: 0 14px; border: 0; background: #2F6BDE; color: #FFFFFF; font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 700; border-radius: 6px">Practice</button>
</div>
</div>
<div aria-hidden="true" style="height: 2px; background: #F0EDE7"><div style="height: 2px; width: {{progress}}%; background: #2F6BDE"></div></div>
</header>

<main onScroll="{{onScroll}}" style="position: relative; flex: 1; min-height: 0; overflow-y: auto">
<div style="max-width: 1040px; margin: 0 auto; padding: 48px 24px 0; display: grid; grid-template-columns: minmax(0, 680px) 260px; column-gap: 52px">

<div style="grid-column: 1 / -1; margin-bottom: 28px">
<p style="margin: 0 0 8px; font-size: 16px; font-style: italic; color: #6B675E">Polity, Unit 1 · Lesson 1</p>
<h1 style="margin: 0; font-size: 54px; line-height: 1.05; font-weight: 700; letter-spacing: -0.015em">The Company Rule, <span style="color: #2F6BDE">1773–1858</span></h1>
</div>

<figure style="grid-column: 1 / -1; margin: 0 0 28px">
<sc-if value="{{hero.hasSrc}}" hint-placeholder-val="{{ false }}"><img src="{{hero.src}}" alt="{{hero.alt}}" style="display: block; width: 100%; height: 360px; object-fit: cover; border-radius: 2px"></sc-if>
<sc-if value="{{hero.noSrc}}" hint-placeholder-val="{{ true }}">
<div role="img" aria-label="{{hero.alt}}" style="height: 360px; background: #EFEBE4; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; font-family: 'Lato', sans-serif; color: #6B675E">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
<span style="font-size: 14px">Image to add: {{hero.want}}</span>
</div>
</sc-if>
<figcaption style="margin-top: 10px; max-width: 680px; font-size: 15px; line-height: 1.5; font-style: italic; color: #5C5850">{{hero.caption}}</figcaption>
</figure>

<div style="grid-column: 1">
<p style="margin: 0 0 18px; font-size: {{fsLead}}px; line-height: 1.6">In 1600 a group of London merchants got a royal charter to trade with the East. A century and a half later, that trading company was collecting taxes, running courts and fighting wars across eastern India.</p>
<p style="margin: 0 0 32px; font-size: {{fs}}px; line-height: 1.65">Back in London, Parliament began to ask an awkward question: who was the Company answerable to? The eight laws in this lesson are its answer, worked out a little at a time between 1773 and 1858.</p>
</div>
<div style="grid-column: 2">
<sc-if value="{{showHint}}" hint-placeholder-val="{{ true }}">
<p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5; color: #4A4740; font-style: italic">A small tip: click any <span style="text-decoration: underline dotted #2F6BDE; text-underline-offset: 4px">underlined word</span> and its meaning appears here in the margin. Select any words to highlight them, and click a point's number to write your own note. <button onClick="{{hideHint}}" style="border: 0; background: transparent; padding: 0; font: inherit; color: #2F6BDE; text-decoration: underline">Got it</button></p>
</sc-if>
</div>

<figure style="grid-column: 1 / -1; margin: 0 0 40px; border-top: 1px solid #1C1B19; border-bottom: 1px solid #D9D5CC; padding: 18px 0 18px; font-family: 'Lato', sans-serif">
<div style="display: grid; grid-template-columns: minmax(0, 1.25fr) 120px minmax(0, 1fr); gap: 16px; align-items: stretch">
<div style="border: 1.5px solid #2F6BDE; border-radius: 6px; padding: 14px 16px 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px">
<b style="font-family: 'Source Serif 4', serif; font-size: 20px; color: #2F6BDE">The Company Rule, 1773–1858</b>
<span style="font-size: 12px; color: #3C3F43; font-weight: 600">you are here</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px">
<sc-for list="{{nav}}" as="y" hint-placeholder-count="8">
<a href="#w-{{y.year}}" style="min-height: 36px; display: grid; grid-template-columns: 44px 1fr; align-items: center; column-gap: 6px; text-decoration: none; color: #1C1B19; border-top: 1px solid #EEEBE5">
<b style="font-size: 14px; color: #2F6BDE">{{y.year}}</b>
<span style="font-size: 14px; color: #3F3C36">{{y.title}}</span>
</a>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; text-align: center; font-size: 13px; line-height: 1.45; color: #4A4740">
<svg width="56" height="14" viewBox="0 0 56 14" fill="none" stroke="#8A857B" stroke-width="1.5" aria-hidden="true"><path d="M2 7h50M46 2l6 5-6 5"/></svg>
1857, the revolt.<br>1858, the Crown takes over.
</div>
<div style="border: 1px solid #D9D5CC; border-radius: 6px; padding: 14px 16px; color: #6B675E">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px">
<b style="font-family: 'Source Serif 4', serif; font-size: 20px; color: #4A4740">The Crown Rule, 1858–1947</b>
<span style="font-size: 12px">next lesson</span>
</div>
<div style="display: grid; grid-template-columns: 44px 1fr; row-gap: 8px; column-gap: 6px; font-size: 14px">
<b>1858</b><span>Government of India Act</span>
<b>1861</b><span>Indian Councils Act</span>
<b>1892</b><span>Indian Councils Act</span>
<b>1909</b><span>Morley-Minto Reforms</span>
<b>1919</b><span>Montagu-Chelmsford Reforms</span>
<b>1935</b><span>Government of India Act</span>
</div>
</div>
</div>
<figcaption style="margin-top: 12px; font-family: 'Source Serif 4', serif; font-size: 15px; font-style: italic; color: #5C5850">Fig. 1 · British rule in India came in two halves. This lesson is the first.</figcaption>
</figure>

<sc-for list="{{acts}}" as="a" hint-placeholder-count="2">
<section id="w-{{a.year}}" style="grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 680px) 260px; column-gap: 52px; padding: 36px 0 44px; border-top: 1px solid #E7E4DE">

<div style="grid-column: 1; min-width: 0">
<p style="margin: 0 0 4px; font-family: 'Lato', sans-serif; font-size: 14px; color: #8A857B">{{a.no}} of 8</p>
<h2 style="margin: 0 0 18px; font-size: 34px; line-height: 1.12; font-weight: 700">{{a.title}}, <span style="color: #2F6BDE">{{a.year}}</span></h2>
<p id="hl-lead-{{a.year}}" style="margin: 0 0 22px; font-size: {{fs}}px; line-height: 1.65"><sc-for list="{{a.leadSegs}}" as="ls" hint-placeholder-count="1"><span style="background: {{ls.hl}}; -webkit-box-decoration-break: clone; box-decoration-break: clone">{{ls.t}}</span></sc-for></p>

<sc-if value="{{a.wide}}" hint-placeholder-val="{{ false }}">
<figure style="margin: 0 0 24px">
<sc-if value="{{a.hasSrc}}" hint-placeholder-val="{{ false }}"><img src="{{a.src}}" alt="{{a.alt}}" style="display: block; width: 100%; height: 300px; object-fit: cover; border-radius: 2px"></sc-if>
<sc-if value="{{a.noSrc}}" hint-placeholder-val="{{ true }}"><div role="img" aria-label="{{a.alt}}" style="height: 300px; background: #EFEBE4; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 40px; text-align: center; font-family: 'Lato', sans-serif; font-size: 14px; color: #6B675E"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>Image to add: {{a.want}}</div></sc-if>
<figcaption style="margin-top: 8px; font-size: 15px; line-height: 1.5; font-style: italic; color: #5C5850">{{a.caption}}</figcaption>
</figure>
</sc-if>

<p style="margin: 0 0 10px; font-size: {{fs}}px; line-height: 1.6">{{a.listIntro}}</p>
<div style="margin-bottom: 24px">
<sc-for list="{{a.provs}}" as="p" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 42px minmax(0, 1fr); column-gap: 4px; align-items: start">
<button aria-label="{{p.btnLabel}}" aria-expanded="{{p.showActions}}" onClick="{{p.toggleSel}}" style="width: 42px; height: 42px; border: 0; background: transparent; padding: {{p.numTop}}px 0 0; display: flex; align-items: flex-start; justify-content: flex-start">
<span style="width: 28px; height: 28px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Lato', sans-serif; font-variant-numeric: lining-nums; font-size: 15px; font-weight: 600; background: {{p.numBg}}; color: {{p.numColor}}; border: 1px solid {{p.numBorder}}">{{p.n}}</span>
</button>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 0 12px">
<p id="hl-{{p.id}}" style="margin: 0; font-size: {{p.fs}}px; line-height: 1.6"><span style="background: {{p.bg}}; -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 1px 0"><sc-for list="{{p.segs}}" as="s" hint-placeholder-count="2"><sc-if value="{{s.plain}}" hint-placeholder-val="{{ true }}"><span style="background: {{s.hl}}; -webkit-box-decoration-break: clone; box-decoration-break: clone">{{s.t}}</span></sc-if><sc-if value="{{s.isTerm}}" hint-placeholder-val="{{ false }}"><span role="button" tabindex="0" onClick="{{s.open}}" style="border: 0; background: {{s.bg}}; padding: 0; margin: 0; font: inherit; color: inherit; display: inline; line-height: inherit; vertical-align: baseline; text-decoration: underline dotted #2F6BDE; text-decoration-thickness: 1.5px; text-underline-offset: 4px">{{s.t}}</span></sc-if></sc-for></span></p>
<sc-if value="{{p.pyq}}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-start; font-family: 'Kalam', cursive; font-size: 16px; color: #3C3F43; border: 1.5px solid #3C3F43; border-radius: 4px; padding: 0 8px; transform: rotate(-1.5deg)">UPSC asked this · {{p.pyqLabel}}</div>
</sc-if>
<sc-if value="{{p.hasSlip}}" hint-placeholder-val="{{ false }}">
<sc-for list="{{p.slips}}" as="sn" hint-placeholder-count="1">
<div style="position: relative; align-self: flex-start; max-width: 92%; margin: 12px 0 6px 8px; background: {{sn.bg}}; padding: 18px 16px 12px; transform: rotate({{sn.tilt}}deg); box-shadow: 0 2px 5px rgba(0,0,0,0.13); opacity: {{sn.op}}">
<div aria-hidden="true" style="position: absolute; top: -9px; left: 50%; width: 70px; height: 18px; margin-left: -35px; background: rgba(255,255,255,0.7); border: 1px solid rgba(0,0,0,0.06); transform: rotate(-3deg)"></div>
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 2px"><span style="font-family: 'Kalam', cursive; font-size: 15px; font-weight: 700; color: {{sn.labelColor}}">{{sn.label}}</span><span style="font-family: 'Lato', sans-serif; font-size: 11px; color: #7A5A52">{{sn.dates}}</span></div>
<div style="font-family: 'Kalam', cursive; font-size: 18px; line-height: 1.38; color: #3A140E; text-decoration: {{sn.deco}}; text-decoration-color: rgba(46,125,50,0.7)">{{sn.t}}</div>
</div>
</sc-for>
</sc-if>
<sc-if value="{{p.showActions}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 8px">
<button onClick="{{p.toggleMark}}" style="height: 38px; padding: 0 14px; border: 1px solid #C9A227; background: #FFF7D6; color: #5C4A0A; font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 500; border-radius: 19px">{{p.markLabel}}</button>
<button onClick="{{p.startNote}}" style="height: 38px; padding: 0 14px; border: 1px solid #CFCBC2; background: #FFFFFF; color: #1C1B19; font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 500; border-radius: 19px">{{p.noteLabel}}</button>
</div>
</sc-if>
<sc-if value="{{p.editing}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px; font-family: 'Lato', sans-serif">
<label for="note-input-web" style="font-size: 12px; color: #6B675E">Your note on this point</label>
<textarea id="note-input-web" rows="2" value="{{p.draft}}" onChange="{{p.onDraft}}" placeholder="Write it your way" style="font-family: 'Kalam', cursive; font-size: 18px; line-height: 1.4; color: #2F6BDE; border: 1.5px solid #2F6BDE; border-radius: 6px; padding: 8px 10px; resize: vertical; box-sizing: border-box; width: 100%"></textarea>
<div style="display: flex; gap: 8px">
<button onClick="{{p.saveNote}}" style="height: 38px; padding: 0 16px; border: 0; background: #2F6BDE; color: #FFFFFF; font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 500; border-radius: 19px">Save note</button>
<button onClick="{{p.cancelNote}}" style="height: 38px; padding: 0 14px; border: 0; background: transparent; color: #6B675E; font-family: 'Lato', sans-serif; font-size: 14px">Cancel</button>
</div>
</div>
</sc-if>
</div>
</div>
</sc-for>
</div>

<figure style="margin: 0 0 22px; font-family: 'Lato', sans-serif">
<div style="border: 1px solid #E2DED6; border-radius: 6px; padding: 22px 24px">
<div style="max-width: 440px; margin: 0 auto">

<sc-if value="{{a.f1773}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; align-items: stretch">
<div style="align-self: center; border: 1px solid #CFCBC2; color: #3F3C36; border-radius: 4px; padding: 7px 14px; font-size: 14px">Parliament, London</div>
<div style="position: relative; height: 30px"><div style="position: absolute; left: 50%; top: 0; width: 1.5px; height: 30px; background: #8A857B"></div><div style="position: absolute; left: calc(50% + 10px); top: 6px; font-family: 'Source Serif 4', serif; font-size: 14px; font-style: italic; color: #6B675E">keeps watch</div></div>
<div style="background: #2F6BDE; color: #FFFFFF; border-radius: 4px; padding: 11px; font-size: 15px; line-height: 1.35; text-align: center"><b>Governor-General of Bengal</b><br><span style="font-size: 14px">and his council of four</span></div>
<div style="position: relative; height: 14px"><div style="position: absolute; left: 50%; top: 0; width: 1.5px; height: 14px; background: #8A857B"></div></div>
<div style="height: 12px; margin: 0 25%; border: 1.5px solid #8A857B; border-bottom: 0"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<div style="border: 1px solid #2F6BDE; color: #2F6BDE; border-radius: 4px; padding: 9px; font-size: 14px; text-align: center">Bombay</div>
<div style="border: 1px solid #2F6BDE; color: #2F6BDE; border-radius: 4px; padding: 9px; font-size: 14px; text-align: center">Madras</div>
</div>
<div style="margin-top: 14px; border: 1.5px dashed #8A857B; border-radius: 4px; padding: 9px; font-size: 14px; color: #3F3C36; text-align: center">and, on the side, a Supreme Court at Calcutta</div>
</div>
</sc-if>

<sc-if value="{{a.f1781}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; font-size: 14px; line-height: 1.45">
<div style="display: flex; flex-direction: column; gap: 8px; color: #2F6BDE"><b>The Court still hears</b><span>ordinary civil and criminal cases</span><span>family cases, now under personal law</span></div>
<div style="display: flex; flex-direction: column; gap: 8px; color: #3C3F43"><b>Taken off its desk</b><span style="text-decoration: line-through">officials' acts on duty</span><span style="text-decoration: line-through">revenue disputes</span></div>
</div>
</sc-if>

<sc-if value="{{a.f1784}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: stretch">
<div style="align-self: center; border: 1px solid #CFCBC2; color: #3F3C36; border-radius: 4px; padding: 7px 14px; font-size: 14px">India's affairs</div>
<div style="position: relative; height: 14px"><div style="position: absolute; left: 50%; top: 0; width: 1.5px; height: 14px; background: #8A857B"></div></div>
<div style="height: 12px; margin: 0 25%; border: 1.5px solid #8A857B; border-bottom: 0"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<div style="border: 1px solid #3C3F43; color: #3C3F43; border-radius: 4px; padding: 11px 6px; font-size: 14px; line-height: 1.4; text-align: center"><b>Court of Directors</b><br>the business</div>
<div style="background: #2F6BDE; color: #FFFFFF; border-radius: 4px; padding: 11px 6px; font-size: 14px; line-height: 1.4; text-align: center"><b>Board of Control</b><br>the politics</div>
</div>
</div>
</sc-if>

<sc-if value="{{a.f1786}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: stretch">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr); align-items: center">
<div style="border: 1px solid #2F6BDE; color: #2F6BDE; border-radius: 4px; padding: 11px 4px; font-size: 14px; text-align: center">Governor-General</div>
<div style="text-align: center; font-family: 'Source Serif 4', serif; font-size: 22px; color: #6B675E">+</div>
<div style="border: 1px solid #2F6BDE; color: #2F6BDE; border-radius: 4px; padding: 11px 4px; font-size: 14px; text-align: center">Commander-in-Chief</div>
</div>
<div style="position: relative; height: 22px"><div style="position: absolute; left: 50%; top: 0; width: 1.5px; height: 22px; background: #8A857B"></div></div>
<div style="background: #2F6BDE; color: #FFFFFF; border-radius: 4px; padding: 11px; font-size: 15px; text-align: center">one man: Cornwallis</div>
</div>
</sc-if>

<sc-if value="{{a.f1793}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<div aria-hidden="true" style="position: absolute; left: 12.5%; right: 12.5%; top: 6px; height: 1.5px; background: #8A857B"></div>

<h1 style="margin: 0 0 10px; font-family: 'Source Serif 4', serif; font-size: 28px; line-height: 1.15; font-weight: 700">The Company Rule, on paper</h1>
<p style="margin: 0 0 6px; font-family: 'Source Serif 4', serif; font-size: 16px; line-height: 1.55; color: #3F3C36">Seven short tasks, about eight minutes. Work through them like a pencil worksheet: nothing is marked until you press <i>Check</i>, and you can look back at the lesson any time.</p>
<div style="margin: 0 0 26px; display: flex; align-items: baseline; gap: 8px; font-size: 14px; color: #6B675E">Name <span style="flex: 1; border-bottom: 1px solid #CFCBC2; font-family: 'Kalam', cursive; font-size: 18px; color: #24477A; padding-left: 6px"> </span></div>

<h2 style="margin: 0 0 4px; font-family: 'Source Serif 4', serif; font-size: 19px; font-weight: 700">1. What happened first?</h2>

<p style="margin: 0 0 12px; font-family: 'Source Serif 4', serif; font-size: 15px; font-style: italic; color: #5C5850">After 1784, who ran what? Fill each side with a name and its job.</p>

<h2 style="margin: 0 0 4px; font-family: 'Source Serif 4', serif; font-size: 19px; font-weight: 700">5. Circle the odd one out</h2>
<p style="margin: 0 0 12px; font-family: 'Source Serif 4', serif; font-size: 15px; font-style: italic; color: #5C5850">Three of these came with the Charter Act of 1813. One did not. This exact trap was set in Prelims 2019.</p>

<script>
DC.define("Web", function (DCLogic) {

var TERMS = {
  polAdmin: { title: "Political and administrative functions", body: "Ruling, not just trading: collecting revenue, keeping order, running courts. In 1773 Parliament admitted, for the first time, that the Company was doing a government's work." },
  ggBengal: { title: "Governor-General of Bengal", body: "The head of the Company's government in Bengal, now with authority over Bombay and Madras too. Not yet of all India; that title only came in 1833." },
  council: { title: "The council of four", body: "Four members who governed alongside the Governor-General. Decisions went by majority, so they could outvote him, until the Act of 1786 changed that." },
  sc: { title: "Supreme Court at Calcutta", body: "Set up in 1774 with a chief justice and three judges. The first chief justice was Sir Elijah Impey." },
  revenue: { title: "Revenue matters", body: "Disputes over land revenue and how it was collected, the Company's main source of money. After 1781 the Supreme Court could not hear them." },
  personal: { title: "Personal law", body: "A community's own rules on marriage, inheritance and family: Hindu law for Hindus, Mohammedan law for Muslims." },
  cod: { title: "Court of Directors", body: "The Company's own board in London, elected by its shareholders. After 1784 it ran only the business side." },
  boc: { title: "Board of Control", body: "A new body of the British government, set up in 1784 to oversee the Company's political, military and revenue affairs." },
  dual: { title: "Dual government", body: "India run by two masters at once: the Company for trade, the Crown's Board for politics. It lasted until 1858." },
  cinc: { title: "Commander-in-Chief", body: "Head of the army. From 1786 the Governor-General held this job as well." },
  charter: { title: "Charter", body: "The Company's licence from Parliament, renewed every twenty years: 1793, 1813, 1833, 1853." },
  sovereign: { title: "Sovereignty of the Crown", body: "The final authority belonged to the British Crown. The Company only held its territories on the Crown's behalf." },
  acts: { title: "Acts, not Regulations", body: "Laws made in India before 1833 were called Regulations. From this Act on, they were called Acts." },
  open: { title: "Open competition", body: "Choosing civil servants by an open exam, rather than by the directors handing out posts to people they knew." },
  macaulay: { title: "Macaulay Committee", body: "Set up in 1854 to draw up the rules for the new civil service exam." },
  minip: { title: "Mini-Parliament", body: "The new Legislative Council worked much like the British Parliament: bills, debate, procedure." }
};

function T(k, t) { return { k: k, t: t }; }

var HERO = { src: "assets/fbe48e8284e81fcd60ab99576223275b.jpg", want: "East India House, Leadenhall Street, London (public-domain engraving, early 1800s)", alt: "East India House, the Company's headquarters in London", caption: "East India House on Leadenhall Street, London, drawn by Thomas Shepherd around 1828. The Company was run from here. From here, a trading firm governed millions of people in India." };

var ACTS = [
  { year: "1773", title: "The Regulating Act", short: "Regulating Act",
    img: { kind: "portrait", src: "assets/458ec3c9392239a6767916d49d49f02c.jpg", want: "Warren Hastings, by Tilly Kettle", alt: "Portrait of Warren Hastings", caption: "Warren Hastings, painted by Tilly Kettle around 1772. He became the first Governor-General of Bengal." },
    lead: "By 1772 the Company was nearly broke. It went to Parliament for a loan, while its own officers were coming home rich from private trade and \"presents\". Parliament lent the money, but it wanted something back: a say in how the Company ran India. The Regulating Act was the price.",
    listIntro: "Here is what it changed.",
    provs: [

      ["He was given a ", T("council", "council of four"), " to govern with."],
      ["The Governors of Bombay and Madras now answered to Bengal."],

  { year: "1781", title: "The Amending Act", short: "Amending Act",
    img: null,
    lead: "The new set-up had a flaw. The Supreme Court and the Governor-General's council both thought they had the final word, and they kept colliding, over revenue cases and over what officials did on the job. Eight years in, Parliament had to referee.",
    listIntro: "So it drew some lines.",
    provs: [
      ["The Governor-General, his council and Company servants could no longer be taken to the Supreme Court for things done in their official capacity."],

    fig: "f1781", figCap: "Fig. 1.2 · The Court made in 1773 is trimmed back in 1781.",

  { year: "1784", title: "Pitt's India Act", short: "Pitt's India Act",
    img: { kind: "portrait", src: "assets/d0d8865078eadf3925f4df2522a3f8c4.jpg", want: "William Pitt the Younger, portrait", alt: "Portrait of William Pitt the Younger", caption: "William Pitt the Younger, painted by George Romney. He became prime minister at 24. His India Act put the Company's politics under a government board." },
    lead: "Parliament still wasn't satisfied. William Pitt, the new prime minister, found a middle path: let the Company keep its business, but put its politics under a board answerable to the government. For the next 74 years, India would have two masters at once.",

    provs: [
